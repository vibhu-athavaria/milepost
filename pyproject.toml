[project]
name = "milepost"
version = "0.1.0"
description = "Git-native, drift-checked codebase memory for coding agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "typer",
    "pydantic>=2",
    "pyyaml",
    "wcmatch",
    "mcp",
    "litellm",
    "fastembed",
    "numpy",
    "tree-sitter",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
    "python-dotenv>=1.2.4",
]

[project.scripts]
milepost = "milepost.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv]
# Intel Macs: newer onnxruntime (a fastembed dependency) ships no wheel for macOS x86_64.
# Requiring this environment makes the resolver pick a version that still does.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.uv.build-backend]
module-root = ""
module-name = "milepost"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixtures are test data: their content (including "unused" imports) must not be rewritten.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["milepost", "scripts"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true
